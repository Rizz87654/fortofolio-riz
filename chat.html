<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Chat - RizDev</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: #f4f4f0;
      background-image: radial-gradient(#000 1.5px, transparent 1.5px);
      background-size: 25px 25px;
      color: #000; height: 100vh; display: flex; flex-direction: column;
      overflow: hidden;
    }

    .chat-container { 
      display: flex; flex-direction: column; height: 100%; 
      max-width: 800px; margin: 0 auto; width: 100%; padding: 15px; 
    }

    /* Navbar Chat */
    .chat-nav {
      display: flex; justify-content: space-between; align-items: center;
      background: #00e5ff; border: 3px solid #000; border-radius: 12px;
      padding: 15px; box-shadow: 4px 4px 0px #000; margin-bottom: 15px; z-index: 10;
    }
    .chat-nav h2 { font-size: 22px; font-weight: 800; text-transform: uppercase; }
    .back-btn {
      background: #ff7b9c; border: 3px solid #000; padding: 8px 16px; border-radius: 8px;
      font-weight: 800; font-size: 14px; text-decoration: none; color: #000; 
      box-shadow: 3px 3px 0px #000; transition: all 0.2s ease;
      display: flex; align-items: center; gap: 5px;
    }
    .back-btn:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0px #000; }

    /* Pesan Error di Layar */
    #error-message {
      display: none;
      background: #ff6b6b; border: 3px solid #000; padding: 15px;
      border-radius: 10px; box-shadow: 4px 4px 0px #000;
      font-weight: 800; text-align: center; margin-bottom: 15px;
    }

    /* Login Box */
    #login-box {
      background: #fff; border: 4px solid #000; border-radius: 20px;
      padding: 30px; box-shadow: 8px 8px 0px #000; text-align: center;
      margin: auto; max-width: 400px; width: 100%;
    }
    #login-box h3 { font-size: 28px; font-weight: 800; margin-bottom: 10px; text-transform: uppercase; }
    #login-box p { font-size: 15px; font-weight: 600; margin-bottom: 25px; line-height: 1.5; }
    #login-box input {
      width: 100%; padding: 15px; border: 3px solid #000; border-radius: 10px;
      font-family: inherit; font-weight: 700; font-size: 16px; margin-bottom: 20px; 
      outline: none; box-shadow: 3px 3px 0px #000;
    }
    #login-box input:focus { transform: translate(-2px, -2px); box-shadow: 5px 5px 0px #000; }
    
    #login-box button {
      width: 100%; padding: 16px; background: #ffe600; border: 3px solid #000;
      border-radius: 10px; font-family: inherit; font-weight: 800; font-size: 18px;
      cursor: pointer; box-shadow: 4px 4px 0px #000; text-transform: uppercase;
      transition: all 0.2s ease;
    }
    #login-box button:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0px #000; background: #fff; }
    #login-box button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #000; }

    /* Area Chat */
    #chat-area { display: none; flex-direction: column; flex: 1; overflow: hidden; }
    
    .chat-messages {
      flex: 1; overflow-y: auto; padding: 15px; background: #fff;
      border: 3px solid #000; border-radius: 12px; box-shadow: 4px 4px 0px #000;
      margin-bottom: 15px; display: flex; flex-direction: column; gap: 12px;
    }
    .message-box {
      background: #f4f4f0; padding: 12px 16px; border: 2px solid #000; border-radius: 8px;
      max-width: 85%; align-self: flex-start; box-shadow: 2px 2px 0px #000;
      word-wrap: break-word;
    }
    .message-box.mine { background: #00e5ff; align-self: flex-end; }
    .msg-name { font-weight: 800; font-size: 13px; margin-bottom: 4px; color: #333; text-transform: uppercase; }
    .msg-text { font-weight: 600; font-size: 15px; }

    /* Input Chat */
    .chat-input-area { display: flex; gap: 10px; }
    .chat-input-area input {
      flex: 1; padding: 15px; border: 3px solid #000; border-radius: 10px;
      font-family: inherit; font-weight: 700; font-size: 15px; outline: none;
      box-shadow: 3px 3px 0px #000;
    }
    .chat-input-area button {
      padding: 0 25px; background: #ff7b9c; border: 3px solid #000;
      border-radius: 10px; font-weight: 800; cursor: pointer; 
      box-shadow: 3px 3px 0px #000; font-family: inherit; font-size: 16px;
      transition: all 0.2s ease;
    }
    .chat-input-area button:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0px #000; }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-nav">
      <h2>GLOBAL CHAT</h2>
      <a href="index.html" class="back-btn">&larr; Kembali</a>
    </div>

    <!-- Pesan Error -->
    <div id="error-message"></div>

    <!-- Form Login Username -->
    <div id="login-box">
      <h3>Masuk Chat</h3>
      <p>Masukkan username Anda untuk bergabung ke dalam ruang global chat demi keamanan bersama.</p>
      <input type="text" id="username-input" placeholder="@UsernameKamu" maxlength="20" />
      <!-- TOMBOL -->
      <button id="btn-masuk">Masuk Chat</button>
    </div>

    <!-- Ruang Chat -->
    <div id="chat-area">
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="Ketik pesan..." autocomplete="off" onkeypress="handleKeyPress(event)" />
        <button onclick="sendMessage()">Kirim</button>
      </div>
    </div>
  </div>

  <!-- Script Supabase Versi 2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ====================================================
    // URL DAN KEY SUPABASE
    // ====================================================
    const SUPABASE_URL = 'https://mhijlcsxogfforriencs.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1oaWpsY3N4b2dmZm9ycmllbmNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1MDA3MjAsImV4cCI6MjEwOTA3NjcyMH0.WRDyMXiKEXaJs652tXvb3T21YfDL7tN4tRUQej6sSCk';
    
    let supabaseClient = null;
    let currentUser = null;

    // Fungsi untuk menampilkan error di layar
    function showError(msg) {
      const errDiv = document.getElementById('error-message');
      errDiv.textContent = msg;
      errDiv.style.display = 'block';
    }

    // Event Listener saat halaman dimuat
    document.addEventListener("DOMContentLoaded", () => {
      const btnMasuk = document.getElementById('btn-masuk');

      // Cek ketersediaan library Supabase
      if (typeof window.supabase === 'undefined') {
        showError('Error: Library Supabase gagal dimuat. Pastikan internet lancar atau coba gunakan VPN.');
        return; // Berhenti, tombol tidak akan berfungsi
      }

      // Jika library ada, inisialisasi Supabase
      try {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } catch (e) {
        showError('Error inisialisasi: ' + e.message);
        return;
      }

      // Pasang fungsi klik pada tombol
      btnMasuk.addEventListener('click', () => {
        const username = document.getElementById('username-input').value.trim();
        
        if (username.length < 3) {
          alert('Username minimal 3 karakter!');
          return;
        }

        currentUser = username;
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('chat-area').style.display = 'flex';
        
        loadMessages();
        subscribeToChat();
      });
    });

    // Fungsi Ambil Pesan Lama
    async function loadMessages() {
      if (!supabaseClient) return;
      
      const { data, error } = await supabaseClient
        .from('messages')
        .select('*')
        .order('created_at', { ascending: true })
        .limit(50);

      if (error) {
        showError('Gagal memuat pesan: ' + error.message + '. Pastikan tabel sudah dibuat.');
        return;
      }

      const messagesContainer = document.getElementById('chat-messages');
      messagesContainer.innerHTML = '';
      data.forEach(msg => appendMessage(msg));
      scrollToBottom();
    }

    // Fungsi Kirim Pesan
    async function sendMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();

      if (!text || !currentUser || !supabaseClient) return;

      input.value = ''; // Reset input

      const { error } = await supabaseClient
        .from('messages')
        .insert([{ username: currentUser, content: text }]);

      if (error) {
        showError('Gagal mengirim pesan: ' + error.message);
      }
    }

    // Fungsi Tampilkan Pesan ke Layar
    function appendMessage(msg) {
      const messagesContainer = document.getElementById('chat-messages');
      const div = document.createElement('div');
      
      div.className = `message-box ${msg.username === currentUser ? 'mine' : ''}`;
      
      const safeName = String(msg.username).replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const safeContent = String(msg.content).replace(/</g, "&lt;").replace(/>/g, "&gt;");
      
      div.innerHTML = `
        <div class="msg-name">${safeName}</div>
        <div class="msg-text">${safeContent}</div>
      `;
      
      messagesContainer.appendChild(div);
      scrollToBottom();
    }

    // Realtime Listener
    function subscribeToChat() {
      if (!supabaseClient) return;
      
      supabaseClient
        .channel('public:messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
          appendMessage(payload.new);
        })
        .subscribe();
    }

    // Helper scroll
    function scrollToBottom() {
      const messagesContainer = document.getElementById('chat-messages');
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // Kirim pesan via Enter
    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }
  </script>
</body>
</html>
