<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Global Chat - RizDev</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: #f4f4f0;
      background-image: radial-gradient(#000 1.5px, transparent 1.5px);
      background-size: 25px 25px;
      color: #000; 
      height: 100vh; 
      height: 100dvh; 
      display: flex; 
      flex-direction: column;
      overflow: hidden;
    }

    .chat-container { 
      display: flex; flex-direction: column; height: 100%; 
      max-width: 800px; margin: 0 auto; width: 100%; padding: 10px; 
    }

    /* Navbar Kecil Warna Kuning */
    .chat-nav {
      display: flex; justify-content: space-between; align-items: center;
      background: #ffe600; border: 3px solid #000; border-radius: 10px;
      padding: 8px 12px; box-shadow: 4px 4px 0px #000; margin-bottom: 10px; z-index: 10;
    }
    
    .back-btn {
      background: #ff7b9c; border: 2px solid #000; padding: 6px 10px; border-radius: 6px;
      font-weight: 800; font-size: 12px; text-decoration: none; color: #000; 
      box-shadow: 2px 2px 0px #000; transition: all 0.1s ease;
      display: flex; align-items: center; 
    }
    .back-btn:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px #000; }
    
    .chat-title { font-size: 16px; font-weight: 800; text-transform: uppercase; margin-left: 10px; }

    /* Area Chat */
    #chat-area { display: none; flex-direction: column; flex: 1; overflow: hidden; }
    
    .chat-messages {
      flex: 1; overflow-y: auto; padding: 10px; background: #fff;
      border: 3px solid #000; border-radius: 12px; box-shadow: 4px 4px 0px #000;
      margin-bottom: 10px; display: flex; flex-direction: column; gap: 10px;
      scroll-behavior: smooth;
    }
    
    /* Bubble Chat */
    .message-box {
      background: #f4f4f0; padding: 10px 14px; border: 2px solid #000; border-radius: 10px;
      max-width: 85%; align-self: flex-start; box-shadow: 2px 2px 0px #000;
      word-wrap: break-word; animation: popIn 0.2s ease-out;
    }
    .message-box.mine { background: #00e5ff; align-self: flex-end; }
    .message-box.ai { background: #a78bfa; align-self: flex-start; } /* Warna AI */
    
    .msg-name { font-weight: 800; font-size: 12px; margin-bottom: 4px; color: #333; text-transform: uppercase; }
    .msg-text { font-weight: 600; font-size: 15px; line-height: 1.4; white-space: pre-wrap; }

    /* Indikator AI Mengetik */
    .typing-indicator {
      display: flex; gap: 4px; padding: 5px 10px; font-weight: 800; font-size: 18px; letter-spacing: 2px;
    }
    .typing-indicator span { animation: bounce 1.4s infinite ease-in-out both; }
    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

    /* Media */
    .msg-media { margin-top: 8px; max-width: 100%; border-radius: 6px; border: 2px solid #000; display: block; }

    /* Area Input */
    .chat-input-wrapper { padding-bottom: 15px; padding-bottom: calc(15px + env(safe-area-inset-bottom)); }
    .chat-input-area { display: flex; gap: 8px; align-items: center; }
    
    .file-label {
      background: #a78bfa; border: 3px solid #000; border-radius: 10px;
      width: 45px; height: 45px; display: flex; justify-content: center; align-items: center;
      font-size: 20px; cursor: pointer; box-shadow: 3px 3px 0px #000; flex-shrink: 0;
    }
    input[type="file"] { display: none; }

    .chat-input-area input[type="text"] {
      flex: 1; padding: 10px 12px; border: 3px solid #000; border-radius: 10px;
      font-family: inherit; font-weight: 700; font-size: 14px; outline: none;
      box-shadow: 3px 3px 0px #000; height: 45px;
    }
    
    .btn-send {
      background: #ff7b9c; border: 3px solid #000; border-radius: 10px; cursor: pointer; 
      box-shadow: 3px 3px 0px #000; transition: all 0.1s ease;
      height: 45px; width: 45px; display: flex; justify-content: center; align-items: center; flex-shrink: 0;
    }
    .btn-send svg { width: 22px; height: 22px; fill: #000; }

    @keyframes popIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

    /* Login Box */
    #login-box {
      background: #fff; border: 4px solid #000; border-radius: 20px;
      padding: 25px; box-shadow: 8px 8px 0px #000; text-align: center;
      margin: auto; max-width: 400px; width: 100%;
    }
    #login-box h3 { font-size: 24px; font-weight: 800; margin-bottom: 10px; text-transform: uppercase; }
    #login-box input {
      width: 100%; padding: 15px; border: 3px solid #000; border-radius: 10px;
      font-family: inherit; font-weight: 700; font-size: 16px; margin-bottom: 15px; outline: none;
    }
    #login-box button {
      width: 100%; padding: 15px; background: #00e5ff; border: 3px solid #000;
      border-radius: 10px; font-family: inherit; font-weight: 800; font-size: 16px;
      cursor: pointer; box-shadow: 4px 4px 0px #000; text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-nav">
      <a href="index.html" class="back-btn">&larr; Portofolio</a>
      <div class="chat-title">GLOBAL CHAT</div>
    </div>

    <div id="login-box" style="display: none;">
      <h3>Masuk Chat</h3>
      <input type="text" id="username-input" placeholder="@UsernameKamu" maxlength="20" />
      <button id="btn-masuk">Masuk Chat</button>
    </div>

    <div id="chat-area">
      <div class="chat-messages" id="chat-messages"></div>
      
      <div class="chat-input-wrapper">
        <div class="chat-input-area">
          <label for="file-upload" class="file-label">📎</label>
          <input type="file" id="file-upload" accept="image/*,video/*" onchange="uploadFile(this)" />

          <input type="text" id="chat-input" placeholder="Ketik pesan atau '@ai [tanya]'..." autocomplete="off" onkeypress="handleKeyPress(event)" />
          
          <button class="btn-send" onclick="sendMessage()" title="Kirim">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ====================================================
    // 1. KONFIGURASI SUPABASE
    // ====================================================
    const SUPABASE_URL = 'https://mhijlcsxogfforriencs.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1oaWpsY3N4b2dmZm9ycmllbmNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1MDA3MjAsImV4cCI6MjEwOTA3NjcyMH0.WRDyMXiKEXaJs652tXvb3T21YfDL7tN4tRUQej6sSCk';
    
    // ====================================================
    // 2. KONFIGURASI AI SANSEKAI (TANPA API KEY)
    // ====================================================
    const SANSEKAI_API_URL = 'https://api.sansekai.my.id/api/ai/chatgpt';

    let supabaseClient = null;
    let currentUser = null;
    let isAiResponding = false;

    document.addEventListener("DOMContentLoaded", () => {
      if (typeof window.supabase === 'undefined') {
        alert('Error: Library Supabase gagal dimuat.');
        return;
      }
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const savedUser = localStorage.getItem('rizdev_chat_username');
      if (savedUser) {
        currentUser = savedUser;
        startChat();
      } else {
        document.getElementById('login-box').style.display = 'block';
        document.getElementById('btn-masuk').addEventListener('click', () => {
          const username = document.getElementById('username-input').value.trim();
          if (username.length < 3) return alert('Username minimal 3 karakter!');
          
          localStorage.setItem('rizdev_chat_username', username);
          currentUser = username;
          startChat();
        });
      }
    });

    function startChat() {
      document.getElementById('login-box').style.display = 'none';
      document.getElementById('chat-area').style.display = 'flex';
      loadMessages();
      subscribeToChat();
    }

    async function loadMessages() {
      if (!supabaseClient) return;
      const { data, error } = await supabaseClient.from('messages').select('*').order('created_at', { ascending: true }).limit(100);
      
      if (error) return alert('Gagal memuat pesan.');
      
      const container = document.getElementById('chat-messages');
      container.innerHTML = '';
      data.forEach(msg => appendMessage(msg));
      scrollToBottom();
    }

    // ==========================================
    // FUNGSI KIRIM PESAN & CEK TAG @ai
    // ==========================================
    async function sendMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text || !currentUser) return;

      input.value = ''; 
      
      // Kirim pesan user ke database
      await supabaseClient.from('messages').insert([{ username: currentUser, content: text }]);

      // Cek apakah pesan mengandung tag @ai
      const lowerText = text.toLowerCase();
      if (lowerText.includes('@ai')) {
        const prompt = text.replace(/@ai/gi, '').trim();
        if (prompt.length > 0) {
          askSansekaiAI(prompt);
        } else {
          await supabaseClient.from('messages').insert([{ 
            username: 'Rizdev AI', 
            content: 'Halo! Ada yang bisa saya bantu? Silakan ketik pertanyaan Anda setelah tag @ai. Contoh: @ai jelaskan apa itu hacking' 
          }]);
        }
      }
    }

    // ==========================================
    // FUNGSI AI SANSEKAI (TANPA API KEY)
    // ==========================================
    async function askSansekaiAI(prompt) {
      if (isAiResponding) return;
      isAiResponding = true;

      // Tampilkan indikator mengetik di UI sementara
      const container = document.getElementById('chat-messages');
      const loadingId = 'ai-loading-' + Date.now();
      const loadingDiv = document.createElement('div');
      loadingDiv.id = loadingId;
      loadingDiv.className = 'message-box ai';
      loadingDiv.innerHTML = `
        <div class="msg-name">Rizdev AI</div>
        <div class="typing-indicator"><span>.</span><span>.</span><span>.</span></div>
      `;
      container.appendChild(loadingDiv);
      scrollToBottom();

      try {
        // Tembak API Sansekai
        const response = await fetch(`${SANSEKAI_API_URL}?text=${encodeURIComponent(prompt)}`, {
          method: 'GET',
          headers: {
            'Accept': 'application/json'
          }
        });

        if (!response.ok) throw new Error('Server AI sedang sibuk atau error.');

        const data = await response.json();
        
        // Cek berbagai kemungkinan format respons dari Sansekai
        let aiReply = data.result || data.message || data.response || data.data;
        
        // Jika masih berupa objek, ubah ke string
        if (typeof aiReply === 'object') {
          aiReply = JSON.stringify(aiReply);
        }

        if (!aiReply) throw new Error('Format balasan AI tidak dikenali.');

        // Hapus indikator loading
        document.getElementById(loadingId).remove();

        // Kirim balasan AI ke database chat
        await supabaseClient.from('messages').insert([{ 
          username: 'Rizdev AI', 
          content: aiReply 
        }]);

      } catch (error) {
        // Hapus indikator loading jika error
        const loadingEl = document.getElementById(loadingId);
        if (loadingEl) loadingEl.remove();

        // Kirim pesan error ke chat
        await supabaseClient.from('messages').insert([{ 
          username: 'Rizdev AI', 
          content: `❌ Error: ${error.message}` 
        }]);
      } finally {
        isAiResponding = false;
      }
    }

    // ==========================================
    // FUNGSI UPLOAD FILE
    // ==========================================
    async function uploadFile(input) {
      const file = input.files[0];
      if (!file) return;

      if (file.size > 10 * 1024 * 1024) {
        alert('Ukuran file terlalu besar! Maksimal 10MB.');
        input.value = '';
        return;
      }

      const btnLabel = document.querySelector('.file-label');
      const originalText = btnLabel.innerHTML;
      btnLabel.innerHTML = '⏳'; 
      btnLabel.style.pointerEvents = 'none';

      try {
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;

        const { data, error } = await supabaseClient.storage.from('chat-files').upload(fileName, file);
        if (error) throw error;

        const { data: urlData } = supabaseClient.storage.from('chat-files').getPublicUrl(fileName);
        const fileType = file.type.startsWith('video') ? 'video' : 'image';
        const content = `[${fileType}]${urlData.publicUrl}`;

        await supabaseClient.from('messages').insert([{ username: currentUser, content: content }]);

      } catch (err) {
        alert('Gagal mengunggah file: ' + err.message);
      } finally {
        btnLabel.innerHTML = originalText;
        btnLabel.style.pointerEvents = 'auto';
        input.value = ''; 
      }
    }

    // ==========================================
    // TAMPILKAN PESAN
    // ==========================================
    function appendMessage(msg) {
      const container = document.getElementById('chat-messages');
      
      if (!msg.content) return;

      const div = document.createElement('div');
      
      let className = 'message-box';
      if (msg.username === currentUser) className += ' mine';
      else if (msg.username === 'Rizdev AI') className += ' ai';
      
      div.className = className;
      
      const safeName = String(msg.username).replace(/</g, "&lt;").replace(/>/g, "&gt;");
      let contentHtml = '';

      if (msg.content.startsWith('[image]')) {
        const url = msg.content.replace('[image]', '');
        contentHtml = `<img src="${url}" class="msg-media" onclick="window.open('${url}', '_blank')" />`;
      } else if (msg.content.startsWith('[video]')) {
        const url = msg.content.replace('[video]', '');
        contentHtml = `<video src="${url}" class="msg-media" controls></video>`;
      } else {
        const safeContent = String(msg.content).replace(/</g, "&lt;").replace(/>/g, "&gt;");
        contentHtml = `<div class="msg-text">${safeContent}</div>`;
      }
      
      div.innerHTML = `
        <div class="msg-name">${safeName}</div>
        ${contentHtml}
      `;
      
      container.appendChild(div);
      scrollToBottom();
    }

    function subscribeToChat() {
      if (!supabaseClient) return;
      supabaseClient.channel('public:messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
          if (payload.new.username === 'Rizdev AI') {
             const loaders = document.querySelectorAll('.message-box.ai .typing-indicator');
             loaders.forEach(l => l.parentElement.remove());
          }
          appendMessage(payload.new);
        }).subscribe();
    }

    function scrollToBottom() {
      const container = document.getElementById('chat-messages');
      container.scrollTop = container.scrollHeight;
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }
  </script>
</body>
</html>
